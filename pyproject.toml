[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "factura"
version = "1.1.0"
description = "Single-page PDF invoice generator that reproduces a fixed layout 1:1 from the command line"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "factura/fonts/LICENSE-fonts.txt"]
requires-python = ">=3.11"
authors = [{ name = "Ion Rusu Discultu" }]
keywords = ["invoice", "pdf", "cli", "reportlab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = ["reportlab>=4,<6"]

[project.urls]
Homepage = "https://github.com/ionrusu114/gen_fact_bit"
Issues = "https://github.com/ionrusu114/gen_fact_bit/issues"

[project.scripts]
factura = "factura:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pymupdf>=1.24"]

[tool.hatch.build.targets.wheel]
packages = ["factura"]

[tool.hatch.build.targets.sdist]
exclude = [".github", "tests", ".gitignore"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = ["S603", "S606"]  # subprocess without shell / os.startfile: arguments are local paths, never user-controlled strings

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
